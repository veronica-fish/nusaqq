<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub Mobile UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="topbar">
    <div class="home-icon">⌂</div>
    <div class="search">examplehub.com</div>
    <div class="top-actions">
      <span>⤴</span>
      <span>⋮</span>
    </div>
  </div>

  <div class="header">
    <div class="menu-btn" id="menuBtn">☰</div>
    <div class="logo">QQ<span>NUSA</span></div>
    <div class="chat">🎧<br>LiveChat</div>
  </div>

  <div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <span>Menu</span>
      <button id="closeMenu">✕</button>
    </div>
    <a href="#">Beranda</a>
    <a href="#">Kategori</a>
    <a href="#">Promo</a>
    <a href="#">Bantuan</a>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="balance-bar">
    <div class="welcome">Hi, guest123</div>
    <div class="balance">
      <div class="coin">$</div>
      <span>IDR 0.00</span>
      <span class="refresh" id="refreshBalance">↻</span>
    </div>
  </div>

  <div class="banner">
    <h2>TURNOVER TERBAIK BULAN INI</h2>
    <div class="big">95.000.000</div>
  </div>

  <div class="marquee">
    <span id="marqueeText">🔊 Selamat datang di portal game dan hiburan mobile.</span>
  </div>

  <div class="categories">
    <div class="cat-item"><div class="icon">⚽</div><div>SPORT</div></div>
    <div class="cat-item"><div class="icon">🎥</div><div>LIVE</div></div>
    <div class="cat-item"><div class="icon">🕹️</div><div>E-GAME</div></div>
    <div class="cat-item"><div class="icon">🚀</div><div>ARCADE</div></div>
    <div class="cat-item"><div class="icon">🎣</div><div>FISH</div></div>
  </div>

  <div class="section-title">🔥 HOT GAME</div>

  <div class="games-grid" id="gamesGrid">
    <!-- Diisi lewat JS -->
  </div>

  <div class="bottom-nav">
    <div class="nav-item">
      <span class="icon">🎁</span>
      Promosi
    </div>
    <div class="nav-item">
      <span class="icon">💰</span>
      Deposit
    </div>
    <div class="nav-center">$</div>
    <div class="nav-item">
      <span class="icon">👥</span>
      Komisi
    </div>
    <div class="nav-item">
      <span class="icon">👤</span>
      Akun
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
